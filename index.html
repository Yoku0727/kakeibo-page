<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルな家計簿アプリ</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>
  <header>
    <h1>家計簿</h1>
    <h2>家計簿をつけましょう</h2>
  </header>

  <main>
    <section aria-labelledby="entry-heading">
      <h2 id="entry-heading">家計簿記録の登録</h2>
      <form action="#" method="post">
        <div>
          <label for="date">日付</label>
          <input type="date" id="date" name="date" required>
        </div>

        <div>
          <label for="item">品目</label>
          <input type="text" id="item" name="item" placeholder="例：食料品" required>
        </div>

        <div>
          <label for="type">区分</label>
          <select id="type" name="type" required>
            <option value="expense">支出</option>
            <option value="income">収入</option>
          </select>
        </div>

        <div>
          <label for="amount">金額（円）</label>
          <input type="number" id="amount" name="amount" min="0" step="1" placeholder="例：1200" required>
        </div>

        <button type="submit">追加</button>
      </form>
    </section>

    <section aria-labelledby="summary-heading">
      <h2 id="summary-heading">収支合計</h2>
      <p><output id="total-amount" name="total-amount">0</output> 円</p>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">登録データ一覧</h2>
      <table>
        <caption>登録した家計簿データ</caption>
        <thead>
          <tr>
            <th scope="col">日付</th>
            <th scope="col">品目</th>
            <th scope="col">区分</th>
            <th scope="col">金額（円）</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="4">登録データはありません。</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
